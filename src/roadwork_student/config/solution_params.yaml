# Default parameters of the three solution nodes (same values as the C++ defaults).
# Loaded by roadwork_student/launch/solution.launch.py. All nodes run on sim time.
sense:
  ros__parameters:
    use_sim_time: true
    odom_timeout: 0.20          # s
    camera_timeout: 0.30        # s; stale frames cannot authorize entry
    go_confirm_frames: 3        # consecutive GO frames (10 Hz) before GO is confirmed
    max_assoc_dt: 0.15          # s, max gap between a sensor stamp and the odometry sample used to transform it
    radar_moving_threshold: 0.6 # m/s, |ego-compensated radial velocity| above this = moving object
    radar_gate: 3.0             # m, track association gate
    radar_confirm_hits: 2       # radar updates before a track is confirmed
    radar_miss_limit: 3         # misses inside the FOV before a track is deleted
    radar_max_coast: 20.0       # s, lifetime of a track coasting outside the FOV
plan:
  ros__parameters:
    use_sim_time: true
    bypass_y: 1.25              # m, lateral position while passing the works
    cruise_speed: 3.5           # m/s
    max_lateral_accel: 1.5      # m/s^2
    scene_timeout: 0.25         # s
    plan_validity: 0.25         # s, Plan.valid_until = stamp + this
    stop_distance: 1.0          # m, gap between vehicle front and entry line when stopped without GO
    beacon_max_age: 1.2         # s, a beacon older than min(valid_for, this) cannot authorise entry
    camera_timeout: 0.30        # s, only used to explain why the panel is UNKNOWN
    use_traffic_gap: true       # ablation switch: radar-based gap check for the opposing lane
    radar_timeout: 0.35         # s, older radar evidence cannot certify the opposing lane
    gap_time: 3.0               # s, margin on top of the ego clearing time
    gap_v_nominal: 3.0          # m/s, conservative ego speed for the clearing time
    gap_a_nominal: 1.0          # m/s^2, conservative ego acceleration for the clearing time
    traffic_radius: 1.0         # m, assumed radius of other vehicles
    gap_margin: 1.0             # m, longitudinal margin around the opposing-lane interval
    use_obstacle_check: true    # ablation switch: LiDAR corridor check
    lidar_timeout: 0.35         # s, older LiDAR evidence is no obstacle evidence
    corridor_half_width: 1.3    # m, ego radius 0.9 + 0.4 margin around the planned path
    obstacle_horizon: 40.0      # m of path checked ahead (LiDAR range)
    obstacle_standoff: 2.5      # m, ego reference to the first blocking return when stopped
    obstacle_decel: 2.0         # m/s^2, planned braking for obstacles (vehicle limit 3)
    obstacle_clear_time: 0.3    # s the corridor must stay clear before resuming
act:
  ros__parameters:
    use_sim_time: true
    max_speed: 3.8              # m/s hard cap (violation threshold is 4.05)
    max_plan_age: 0.30          # s
